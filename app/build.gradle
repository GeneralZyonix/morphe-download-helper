plugins {
    // Android application plugin; the version is supplied by the root build.gradle.
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = System.getenv('RELEASE_STORE_FILE')
        ?: keystoreProperties.getProperty('storeFile')
def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD')
        ?: keystoreProperties.getProperty('storePassword')
def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
        ?: keystoreProperties.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')
        ?: keystoreProperties.getProperty('keyPassword')

if (System.getenv('CI') != null && !releaseStoreFile) {
    throw new GradleException(
            'Release signing secrets are missing. Refusing to build a release ' +
                    'with a temporary debug key.')
}

android {
    namespace 'be.alterra.morphehelper'
    compileSdk 35

    defaultConfig {
        applicationId "be.alterra.morphehelper"

        // Android 6.0+ keeps the helper usable on older devices while still allowing
        // modern network and storage APIs.
        minSdk 23
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Bump both values for every public release.
        versionCode 89
        versionName "3.3.0-rc.5"

        // true for pre-release builds; set false only for a stable release.
        // Drives the P/R badge and the Auto update channel.
        buildConfigField "boolean", "PRERELEASE", "true"
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    flavorDimensions "launcher"
    productFlavors {
        // Icon-first build: the launcher entry is always enabled, so the icon
        // appears immediately after installation. This build does not hide it.
        icon {
            dimension "launcher"
            buildConfigField "boolean", "LAUNCHER_ICON_ENABLED", "true"
            resValue "bool", "launcher_icon_enabled", "true"
        }
        // Clean-hide build: the launcher entry is always disabled, so there is
        // no icon to hide and Android cannot create the synthetic App Info
        // shortcut. Open the helper from Morphe or Android Settings.
        noicon {
            dimension "launcher"
            buildConfigField "boolean", "LAUNCHER_ICON_ENABLED", "false"
            resValue "bool", "launcher_icon_enabled", "false"
        }
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Shrink and obfuscate the release build. CI must use the permanent
            // release key; a debug fallback would break every future update.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig releaseStoreFile
                    ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        // Java 17 language level; Android desugaring handles older devices.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider + modern AndroidX helpers.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    debugImplementation 'com.google.android.material:material:1.14.0'

    // HTTP client with cookie/redirect support for APK sites.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Reads AndroidManifest.xml from split APKs that Android's package parser
    // cannot inspect directly (notably Uptodown XAPKs).
    implementation 'net.dongliu:apk-parser:2.6.10'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}












