name: Update patch source catalog

on:
  schedule:
    # Upstream syncs hourly around :17; build shortly after.
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-source-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build compact catalog
        run: python scripts/build_patch_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/patch-sources.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/patch-sources.json
          git commit -m "Update patch source catalog"
          git pull --rebase origin main
          git push origin main
