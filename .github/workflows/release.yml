name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testIconDebugUnitTest testNoiconDebugUnitTest

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleIconRelease assembleNoiconRelease

      - name: Stage assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp app/build/outputs/apk/icon/release/app-icon-release.apk \
            "release/MorpheDownloadHelper-v${VERSION}-universal.apk"
          cp app/build/outputs/apk/noicon/release/app-noicon-release.apk \
            "release/MorpheDownloadHelper-v${VERSION}-universal-noicon.apk"
          cd release
          sha256sum *.apk > "SHA256SUMS-${VERSION}.txt"
          cat "SHA256SUMS-${VERSION}.txt"

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          echo "## Morphe Download Helper ${VERSION}" > "$NOTES"
          echo >> "$NOTES"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found { print }
          ' CHANGELOG.md >> "$NOTES"
          if [ "$(wc -l < "$NOTES")" -le 2 ]; then
            echo "No changelog section found for ${VERSION}" >&2
            exit 1
          fi
          cat "$NOTES"

      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is not set; the release will be authored by github-actions[bot]."
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if grep -q 'PRERELEASE", "true"' app/build.gradle; then
            RELEASE_FLAGS="--prerelease --latest=false"
          else
            RELEASE_FLAGS="--latest"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Morphe Download Helper ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $RELEASE_FLAGS \
            release/*.apk "release/SHA256SUMS-${VERSION}.txt"
