name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testIconDebugUnitTest testNoiconDebugUnitTest

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleIconRelease assembleNoiconRelease

      - name: Stage assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp app/build/outputs/apk/icon/release/app-icon-release.apk \
            "release/MorpheDownloadHelper-v${VERSION}-universal.apk"
          cp app/build/outputs/apk/noicon/release/app-noicon-release.apk \
            "release/MorpheDownloadHelper-v${VERSION}-universal-noicon.apk"
          cd release
          sha256sum *.apk > "SHA256SUMS-${VERSION}.txt"
          cat "SHA256SUMS-${VERSION}.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if grep -q 'PRERELEASE", "true"' app/build.gradle; then
            RELEASE_FLAGS="--prerelease --latest=false"
          else
            RELEASE_FLAGS="--latest"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Morphe Download Helper ${VERSION}" \
            --generate-notes \
            $RELEASE_FLAGS \
            release/*.apk "release/SHA256SUMS-${VERSION}.txt"
